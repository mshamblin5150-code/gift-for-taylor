name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: packages/schedule_rules
      - run: flutter analyze
      - run: flutter test
      - run: dart test
        working-directory: packages/schedule_rules
      - run: flutter build web --release

  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_migration_versions.py
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
      - run: python -m pip install 'psycopg[binary]>=3,<4'
      - run: python scripts/check_client_schema.py
