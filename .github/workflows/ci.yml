name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calendar-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/calendar-feed/index.ts
      - run: deno test supabase/functions/calendar-feed/index_test.ts
      - run: deno check supabase/functions/send-calendar-invitation/index.ts
      - run: deno test --allow-env supabase/functions/send-calendar-invitation/calendar_test.ts
      - run: deno test supabase/functions/send-calendar-invitation/delivery_test.ts

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub get
        working-directory: packages/schedule_rules
      - run: dart pub get
        working-directory: packages/schedule_rules_testing
      - run: dart pub get
        working-directory: packages/schedule_book
      - run: flutter analyze
      - run: flutter test
      - run: dart test
        working-directory: packages/schedule_rules
      - run: dart test
        working-directory: packages/schedule_rules_testing
      - run: dart test
        working-directory: packages/schedule_book
      - run: python -m pip install pdfplumber
      - run: python tool/check_book_page_pdf.py
      - run: flutter build web --release

  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_migration_versions.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - run: supabase start
      - run: supabase test db
      - run: python -m pip install 'psycopg[binary]>=3,<4'
      - run: python scripts/check_client_schema.py
