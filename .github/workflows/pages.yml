name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# This run deploys Edge Functions and applies database migrations. Migrations
# are not safe to interrupt part
# way through. A superseded run therefore queues rather than cancelling: a
# second push waits its turn instead of killing a `supabase db push` mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The web app ships every merge, so the database has to keep up with it. A
  # month that opens against a database missing a migration is the Schedule
  # failing to load for everyone on it.
  migrate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_migration_versions.py
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Function deployment needs a Supabase access token and project ref.
      # Deploy send-push before db push: migrations can insert historical
      # staff_notices, and the current function skips rows with push_eligible=false.
      # Name each function so CI never deploys unrelated functions or config.
      - run: supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - run: supabase functions deploy send-calendar-invitation --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      # Migrations use the session-pooler connection string, which reaches only
      # this database. The project's direct host publishes only an AAAA record,
      # while GitHub runners are IPv4-only.
      #
      # Never `supabase config push`: that applies config.toml
      # over the project's hosted settings, Auth included.
      # Parallel merges can introduce migration versions older than the last
      # applied version. Apply every pending file in version order so a later
      # merge cannot strand the web deployment behind the database gate.
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --yes --include-all
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # The new feed function reads columns and an RPC added by this migration.
      - run: supabase functions deploy calendar-feed --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # These three values ship inside the web app, so they are repository
      # variables rather than secrets.
      - run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          --dart-define=VAPID_PUBLIC_KEY=${{ vars.VAPID_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # The build needs no database, so it runs alongside the migration; only going
  # live waits on both.
  deploy:
    if: github.event_name != 'schedule'
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Observe hosted drift without holding the web deployment. On deploy runs,
  # compare only after migrations succeed; on the nightly schedule, migrate is
  # intentionally skipped and this job runs against the current hosted state.
  schema-drift:
    needs: migrate
    if: >-
      ${{ always() &&
          (github.event_name == 'schedule' || needs.migrate.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.107.0
      - run: supabase start
      - run: python -m pip install 'psycopg[binary]>=3,<4'
      - id: drift
        name: Compare hosted invariants with migrations
        continue-on-error: true
        run: >-
          python scripts/check_schema_drift.py
          --report-file schema-drift-report.md
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Open or update the drift issue
        if: steps.drift.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -s schema-drift-report.md ]]; then
            printf '%s\n' \
              '# Hosted schema drift check could not run' \
              '' \
              "See workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              > schema-drift-report.md
          fi
          issue_number="$(
            gh issue list --state open --limit 100 --json number,title \
              --jq '.[] | select(.title == "Hosted schema drift detected") | .number' \
              | head -n 1
          )"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --body-file schema-drift-report.md
          else
            gh issue create \
              --title 'Hosted schema drift detected' \
              --label bug --label needs-triage \
              --body-file schema-drift-report.md
          fi
      - name: Fail when drift was found
        if: steps.drift.outcome == 'failure'
        run: exit 1
