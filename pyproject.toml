[dependency-groups]
python-quality = ["ruff>=0.14,<1", "mypy>=1.18,<2", "Pillow>=11,<13", "numpy>=2,<3", "pdfplumber>=0.11,<1", "psycopg[binary]>=3,<4"]

[tool.ruff]
target-version = "py312"
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["scripts", "tool", "tools", ".claude/skills/ticket-sweep/evals"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
